<!DOCTYPE html>
<html>
<head>
    <title> Pedidos </title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
  </head>

<body>
<header>
  <img src="../assets/img/logo.png" alt="Logo TecnoGames" class="logo" />
    <nav>
      <a href="../index.html">Home</a>
      <a href="../pages/servicios.html">Servicios</a>
      <a href="../pages/equipo.html">Equipo</a>
      <a href="../pages/pedido.html">Realizar pedido</a>
      <a href="../pages/contacto.html">Contacto</a>
      <a href="../pages/faq.html">Preguntas Frecuentes</a>
      <a href="../pages/login.html" class="botonLogin" id="loginLink"> 👤 Login </a>
    </nav>
</header>
<main>
<div class = "titulo_pedidos"> 
  <h1> Haz tu pedido </h1> 
  <p> Completando el siguiente formulario </p>
</div>

<form id="formPedido" class="formPedidos">

  <div class="form-group">
    <label for="producto">Seleccione producto</label>
    <select id="producto" name="producto"></select>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" name="nombre" required>
    </div>

    <div class="form-group">
      <label for="apellido">Apellido</label>
      <input type="text" id="apellido" name="apellido" required>
    </div>

    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>
    </div>
  </div>

  <div class="titulo_pedidos">
    <h2>Detalles de envío</h2>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="calle">Calle</label>
      <input type="text" id="calle" name="calle" required>
    </div>

    <div class="form-group">
      <label for="numero">Número</label>
      <input type="number" id="numero" name="numero" min="0" required>
    </div>

    <div class="form-group">
      <label for="ciudad">Ciudad</label>
      <input type="text" id="ciudad" name="ciudad" required>
    </div>

    <div class="form-group">
      <label for="CP">Código postal</label>
      <input type="text" id="CP" name="CP" required>
    </div>
  </div>

  <div class="titulo_pedidos">
    <h2>Detalles de pago</h2>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label for="opciones_de_pago">Método de pago</label>
      <select id="opciones_de_pago" name="opciones_de_pago">
        <option value="debito">Débito</option>
        <option value="credito">Crédito</option>
      </select>
    </div>

    <div class="form-group">
      <label for="numero_tarjeta">Número de tarjeta</label>
      <input
        type="text"
        id="numero_tarjeta"
        name="numero_tarjeta"
        maxlength="16"
        placeholder="1234567812345678"
        required
      >
    </div>

    <div class="form-group">
      <label for="vencimiento">Vencimiento</label>
      <input type="month" id="vencimiento" name="vencimiento" required>
    </div>

    <div class="form-group">
      <label for="cvv">Código de seguridad</label>
      <input type="text" id="cvv" name="cvv" maxlength="4" required>
    </div>
  </div>

  <button type="submit" class="button_pedidos">
    Pedir
  </button>

</form>

<div id="resultadoPedido" style="display: none; margin-top: 20px;"></div>
<br>
</main>

<footer>
  <p>&copy; 2026 TecnoGames. Todos los derechos reservados.</p>
</footer>
<script src="../js/pedidos.js"></script>
</body>
</html>
